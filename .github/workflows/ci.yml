name: ci

on:
  push:
  pull_request:

jobs:
  host:
    name: host tests (${{ matrix.preset }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [host-debug, host-release, noexc]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DSOMEIP_FETCH_NEWOSP=ON
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  sanitizers:
    name: asan + ubsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset asan -DSOMEIP_FETCH_NEWOSP=ON
      - name: Build
        run: cmake --build --preset asan -j
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --preset asan

  examples:
    name: examples and benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset demo -DSOMEIP_FETCH_NEWOSP=ON
      - name: Build
        run: cmake --build --preset demo -j
      - name: Loopback benchmark
        run: ./build/demo/examples/someip_loopback_bench
      - name: TP and E2E pipeline
        run: ./build/demo/examples/someip_fragmented_demo

  lint:
    name: cpplint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cpplint
        run: pip install cpplint
      - name: Run cpplint
        run: cpplint --recursive include/osp/someip tests examples

  portability:
    name: rt-thread and lwip type checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch newosp and lwIP headers
        run: |
          git clone --depth 1 https://github.com/DeguiLiu/newosp.git /tmp/newosp
          git clone --depth 1 --branch STABLE-2_2_0_RELEASE \
              https://github.com/lwip-tcpip/lwip.git /tmp/lwip
      - name: RT-Thread branch
        run: tools/check_rtthread.sh g++ /tmp/newosp/include
      - name: lwIP socket backend
        run: tools/check_lwip.sh g++ /tmp/lwip /tmp/newosp/include
